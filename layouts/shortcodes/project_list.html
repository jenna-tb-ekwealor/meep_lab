{{ $project := .Get "categories" }}
{{ $publications := where .Site.RegularPages "Section" "publication" }}

<div class="moss-world-publications">
  {{ range $publications.ByDate.Reverse }}
    {{ if in (.Params.projects | default (slice)) $project }}
      {{ partial "views/citation" (dict "page" $.Page "item" .) }}
    {{ end }}
  {{ end }}
</div>
